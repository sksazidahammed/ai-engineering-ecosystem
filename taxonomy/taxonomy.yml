# Single source of truth for categories and subcategories.
# Rules:
#  1. Primary category = the main JOB the thing does for its user (not what it is made of).
#  2. Resource type (skill, MCP server, CLI, ...) is a FACET in the record, never a category.
#  3. If a record genuinely fits two places, pick one primary and list up to 2 in `secondary_categories`.
#  4. Folders/pages are generated from this file; never hand-create a category elsewhere.
version: 1
categories:
  - id: agent-harnesses-and-runtimes
    number: "01"
    name: Agent harnesses and runtimes
    description: The agent itself - the CLI, desktop app, SDK or framework that runs a single coding/general agent.
    replaces: [Coding agent CLIs and harnesses, Local AI and agent applications (agent apps only)]
    subcategories:
      - {id: coding-agent-clis, name: Coding agent CLIs}
      - {id: desktop-and-mobile-agent-apps, name: Desktop and mobile agent apps}
